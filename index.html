<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2d5a27">
<title>Fazenda Sossego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6ecd0;--cream2:#e9d9ae;--ink:#33241a;--wood:#8a5a36;--wood2:#6b4226;--green:#4c9a3c;--green2:#2f6b2a;--gold:#f2c230;--red:#d9482b;--blue:#3d7fd9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2d5a27;font-family:'Pixelify Sans','Courier New',monospace;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#game,#fx{position:fixed;left:0;top:0;display:block}
#game{image-rendering:pixelated;image-rendering:crisp-edges}
#fx{pointer-events:none}
.px{border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);border-radius:6px}
#hud{position:fixed;left:0;right:0;top:0;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;pointer-events:none;z-index:5}
.chip{pointer-events:auto;background:var(--cream);padding:5px 9px;font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap}
.chip small{font-weight:400;font-size:12px;opacity:.75}
.sp{flex:1}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{pointer-events:auto;background:var(--gold);padding:6px 10px;font-weight:700;font-size:16px;border:3px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.g{background:#8fd46a}.btn.w{background:var(--cream)}.btn.r{background:#f08a6a}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
#mission{position:fixed;left:8px;top:92px;max-width:min(300px,70vw);background:rgba(51,36,26,.86);color:#fff3d6;padding:7px 10px;font-size:14px;border-radius:6px;border:2px solid #1c120b;z-index:4;pointer-events:none}
#mission b{color:var(--gold)}
#mbar{height:6px;background:#1c120b;margin-top:5px;border-radius:3px;overflow:hidden}
#mbar i{display:block;height:100%;background:#8fd46a;width:0;transition:width .3s}
#tools{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;z-index:5;pointer-events:none;padding:0 6px}
.tool{pointer-events:auto;width:58px;height:58px;background:var(--cream);border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.tool span{font-size:22px;line-height:1}
.tool.on{background:#8fd46a;transform:translateY(-5px)}
.tool kbd{position:absolute;display:none}
#toasts{position:fixed;left:50%;top:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:8;pointer-events:none;width:92vw}
.toast{background:var(--ink);color:#fff3d6;padding:7px 12px;border-radius:6px;font-size:15px;font-weight:600;animation:tin .25s ease-out;text-align:center;border:2px solid var(--gold)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
.ovl{position:fixed;inset:0;background:rgba(20,30,15,.55);z-index:10;display:none;align-items:center;justify-content:center;padding:10px}
.ovl.show{display:flex}
.panel{background:var(--cream);width:min(560px,100%);max-height:min(88vh,720px);display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:10px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.phead{display:flex;align-items:center;padding:8px 10px;background:var(--wood);color:#fff3d6;font-size:20px;font-weight:700;border-bottom:4px solid var(--ink);border-radius:5px 5px 0 0}
.phead .x{margin-left:auto;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:6px;width:34px;height:34px;font-weight:700;font-size:16px}
.tabs{display:flex;gap:4px;padding:8px 8px 0;flex-wrap:wrap}
.tab{flex:1;background:var(--cream2);border:3px solid var(--ink);border-radius:6px 6px 0 0;padding:5px 1px;font-weight:700;font-size:12px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}.tab i{font-style:normal;font-size:18px;line-height:1}
.tab.on{background:var(--gold)}
.pbody{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:9px;background:#fffaf0;border:3px solid var(--ink);border-radius:6px;padding:7px}
.item .ic{width:52px;height:52px;flex:none;background:#b98f3c;border:2px solid var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:28px;image-rendering:pixelated;background-size:118%;background-position:center;background-repeat:no-repeat}
.item .tx{flex:1;min-width:0;font-size:13px;line-height:1.25}
.item .tx b{font-size:16px;display:block}
.item .btn{font-size:14px;flex:none;min-width:78px}
.crops{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cb{border:2px solid var(--ink);border-radius:5px;background:var(--cream2);font-size:18px;padding:2px 7px}
.cb.on{background:#8fd46a;outline:2px solid var(--ink)}
#title{background:rgba(20,40,18,.45)}
#title .box{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:520px}
.logo{font-weight:700;font-size:clamp(40px,12vw,84px);line-height:.92;letter-spacing:2px;color:#8fd46a;text-shadow:0 4px 0 #1f4a1c,4px 0 0 #1f4a1c,-4px 0 0 #1f4a1c,0 -4px 0 #1f4a1c,0 9px 0 rgba(0,0,0,.45)}
.logo span{display:block;color:#f2a230;text-shadow:0 4px 0 #6b2f10,4px 0 0 #6b2f10,-4px 0 0 #6b2f10,0 -4px 0 #6b2f10,0 9px 0 rgba(0,0,0,.45)}
.sub{color:#fff3d6;font-size:17px;font-weight:600;text-shadow:0 2px 0 #000}
#title .btn{font-size:24px;padding:10px 26px}
#title .btn.w{font-size:15px;padding:6px 14px}
.help{background:rgba(51,36,26,.8);color:#fff3d6;border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.4}
#ctx{position:fixed;left:0;right:0;margin:auto;width:max-content;max-width:94vw;bottom:calc(80px + env(safe-area-inset-bottom));background:rgba(51,36,26,.88);color:#fff3d6;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px;border:2px solid #1c120b;z-index:4;pointer-events:none;display:none;text-align:center}
#ctx b{color:var(--gold)}
#coach{position:fixed;left:0;right:0;margin:auto;bottom:calc(114px + env(safe-area-inset-bottom));width:min(520px,94vw);background:var(--cream);z-index:6;display:none;gap:10px;padding:8px;align-items:flex-start}
#coach.show{display:flex;animation:tin .3s ease-out}
#coach img{width:60px;height:60px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:6px;flex:none}
#coach .who{font-weight:700;font-size:12px;color:var(--wood2);letter-spacing:.5px}
#coach .say{font-size:15px;line-height:1.3;min-height:40px;font-weight:600}
#coach .row{display:flex;align-items:center;gap:8px;margin-top:5px;min-height:30px}
.prog{flex:1;height:10px;background:var(--cream2);border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
#cnum{font-weight:700;font-size:13px}
#coach .btn{font-size:14px;margin-left:auto}
.skip{background:none;border:0;font-size:12px;text-decoration:underline;opacity:.75;padding:6px 2px}
.pulse{animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--gold);transform:translateY(-4px)}}
.gfoot{display:flex;align-items:center;gap:8px;padding:8px;border-top:4px solid var(--ink)}
.dots{flex:1;text-align:center;font-size:14px;font-weight:700}
.cyc{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.card{background:#fffaf0;border:3px solid var(--ink);border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;width:104px;line-height:1.2;overflow-wrap:anywhere}
.card img{width:48px;height:48px;image-rendering:pixelated;border:2px solid var(--ink);display:block;margin:0 auto 4px;background:#b98f3c}
.card.v img{width:96px;height:auto;border:2px solid var(--ink);background:#7aa85a;border-radius:4px}
.card b{display:block;font-size:12px}
.card em{display:block;font-style:normal;background:var(--gold);border-radius:4px;margin-top:4px;font-weight:700;font-size:11px;padding:2px 1px}
.gp{font-size:14px;line-height:1.4;margin:0}
.gp b{color:var(--wood2)}
.ct{width:100%;border-collapse:collapse;font-size:13px;background:#fffaf0;border:3px solid var(--ink)}
.ct td,.ct th{padding:5px 6px;text-align:left;border-bottom:2px solid var(--cream2)}
.ct th{background:var(--cream2);font-size:12px}
.tip{background:#fffaf0;border:3px solid var(--ink);border-left:10px solid var(--green);border-radius:6px;padding:7px 9px;font-size:14px;line-height:1.35}
@media (max-height:520px){#coach{bottom:70px}#coach img{width:40px;height:40px}#coach .say{font-size:13px;min-height:0}#ctx{display:none!important}}
@media (max-width:520px){.chip{font-size:14px;padding:4px 7px}.btn{font-size:14px;padding:5px 8px}#mission{top:88px;font-size:13px}.tool{width:54px;height:54px}}
@media (max-height:420px){#mission{top:50px}.tool{width:48px;height:48px}.tool span{font-size:18px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<div id="hud">
  <div class="chip px" id="cMoney">$0</div>
  <div class="chip px" id="cSilo">Silo 0/300</div>
  <div class="chip px" id="cDay">Dia 1</div>
  <div class="sp"></div>
  <button class="btn g" id="bSell">Vender</button>
  <button class="btn" id="bShop">🛒 Loja</button>
  <button class="btn w" id="bZoom">🔍</button>
  <button class="btn w" id="bSnd">🔊</button>
  <button class="btn w" id="bGuide">📖</button>
</div>
<div id="mission"><span id="mtxt"></span><div id="mbar"><i></i></div></div>
<div id="toasts"></div>
<div id="ctx"></div>
<div id="coach" class="px"><div style="flex:1;min-width:0"><div class="who">SEU ZÉ · PASSO <span id="cstep"></span></div><div class="say" id="csay"></div><div class="row"><div class="prog" id="cprog"><i></i></div><span id="cnum"></span><button class="skip" id="cskip">pular tutorial</button><button class="btn g" id="cnext">Próximo ▶</button></div></div></div>
<div id="tools">
  <button class="tool on" data-t="auto"><span>✨</span>AUTO</button>
  <button class="tool" data-t="plow"><span>🟤</span>ARAR</button>
  <button class="tool" data-t="seed"><span>🌱</span>PLANTAR</button>
  <button class="tool" data-t="spray"><span>💧</span>BORRIFAR</button>
  <button class="tool" data-t="harv"><span>🌾</span>COLHER</button>
</div>

<div class="ovl" id="shop"><div class="panel">
  <div class="phead">🛒 Loja da Fazenda <button class="x" data-act="close">X</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="pbody" id="pbody"></div>
</div></div>

<div class="ovl show" id="title"><div class="box">
  <div class="logo">FAZENDA<span>SOSSEGO</span></div>
  <div class="sub">Are, plante, colha — e veja suas máquinas trabalharem sozinhas.</div>
  <button class="btn g" id="bPlay">▶ Jogar</button>
  <button class="btn w" id="bHow">📖 Como jogar</button>
  <button class="btn w" id="bNew" style="display:none">Novo jogo</button>
  <div class="help"><b>PC:</b> WASD ou setas para dirigir · 1–5 troca a ferramenta · L loja · G guia<br><b>Celular:</b> arraste o dedo na tela para dirigir o trator</div>
</div></div>

<div class="ovl" id="guide"><div class="panel">
  <div class="phead">📖 <span id="gtitle" style="margin-left:8px"></span><button class="x" id="gx">X</button></div>
  <div class="pbody" id="gbody"></div>
  <div class="gfoot"><button class="btn w" id="gprev">◀ Voltar</button><div class="dots" id="gdots"></div><button class="btn" id="gnext">Avançar ▶</button></div>
</div></div>

<script>
(()=>{'use strict';
const T=16,MW=76,MH=52,WW=MW*T,WH=MH*T,N=MW*MH;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hsh(x,y){let n=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;fn(x,c);return c}
function fmt(n){n=Math.floor(n);if(n>=1e6)return(n/1e6).toFixed(2).replace('.',',')+'M';if(n>=1e5)return Math.round(n/1e3)+'k';return n.toLocaleString('pt-BR')}

/* ---------- dados ---------- */
const CROPS=[
 {name:'Trigo',ico:'🌾',price:3,time:50,cost:0,pal:['#e9b824','#d39e1a','#f6d64e','#b9820f'],green:['#7dbb42','#69a637']},
 {name:'Milho',ico:'🌽',price:6,time:75,cost:800,pal:['#5f9a2c','#4f8724','#f2d03b','#75b13a'],green:['#6fb53a','#5a9c2e']},
 {name:'Soja',ico:'🫘',price:10,time:100,cost:2500,pal:['#b7a548','#a08d3a','#cbbb62','#8a7a30'],green:['#5fa64a','#4c9040']},
 {name:'Girassol',ico:'🌻',price:16,time:130,cost:7000,pal:['#4f9438','#437f30','#ffd426','#6b3d14'],green:['#58a03c','#478a30']},
 {name:'Abóbora',ico:'🎃',price:26,time:170,cost:18000,pal:['#3f7d34','#356b2c','#f08a24','#c96a12'],green:['#4a9440','#3c7d34']}];
const FIELDS=[
 {x:16,y:22,w:12,h:8,price:0},{x:49,y:22,w:12,h:8,price:600},{x:30,y:35,w:16,h:8,price:1500},{x:30,y:9,w:16,h:8,price:3000},
 {x:10,y:34,w:16,h:10,price:6000},{x:50,y:34,w:16,h:10,price:12000},{x:8,y:7,w:18,h:11,price:25000},{x:50,y:7,w:18,h:11,price:50000}];
const MTYPES={
 plow:{name:'Trator Arador',desc:'Ara sozinho a terra crua e a palhada.',base:250,col:'#e8891c'},
 seed:{name:'Trator Plantador',desc:'Planta a semente escolhida em cada campo.',base:300,col:'#2f62c9'},
 spray:{name:'Pulverizador',desc:'Tira as ervas daninhas e dá +25% de colheita.',base:350,col:'#2f8f3f'},
 harv:{name:'Colheitadeira',desc:'Colhe tudo o que estiver maduro.',base:500,col:'#e3b21c'}};
const UPS={
 pspd:{name:'Motor turbo',desc:'Seu trator anda +12% mais rápido.',base:200,mul:2,max:5,ico:'🏎️'},
 pwid:{name:'Implementos largos',desc:'Seu trator trabalha uma faixa mais larga.',base:400,mul:2.2,max:4,ico:'↔️'},
 aspd:{name:'Piloto automático+',desc:'Máquinas autônomas +15% mais rápidas.',base:500,mul:2,max:5,ico:'🤖'},
 awid:{name:'Máquinas maiores',desc:'Máquinas autônomas com faixa mais larga.',base:1500,mul:3,max:2,ico:'🚜'},
 silo:{name:'Silo maior',desc:'Dobra a capacidade do silo.',base:300,mul:2,max:8,ico:'🏛️'},
 irr:{name:'Irrigação',desc:'Tudo cresce +15% mais rápido.',base:600,mul:2.2,max:5,ico:'🚿'},
 auto:{name:'Contrato com a cooperativa',desc:'Vende sozinho quando o silo enche.',base:2000,mul:1,max:1,ico:'🤝'}};
const MISSIONS=[
 {t:'Are 30 lotes de terra',k:'plowed',n:30,r:30},{t:'Plante 30 lotes',k:'seeded',n:30,r:30},
 {t:'Pulverize 20 lotes',k:'sprayed',n:20,r:40},{t:'Colha 40 lotes maduros',k:'harvested',n:40,r:60},
 {t:'Venda sua colheita',k:'sold',n:1,r:50},{t:'Compre uma máquina autônoma na Loja',k:'machines',n:1,r:100},
 {t:'Compre o Campo 2',k:'fields',n:2,r:150},{t:'Tenha 3 máquinas autônomas',k:'machines',n:3,r:200},
 {t:'Libere a semente de Milho',k:'crops',n:2,r:250},{t:'Colha 500 lotes',k:'harvested',n:500,r:400},
 {t:'Tenha 4 campos',k:'fields',n:4,r:600},{t:'Ganhe $10.000 no total',k:'earned',n:10000,r:1000},
 {t:'Tenha 8 máquinas autônomas',k:'machines',n:8,r:1500},{t:'Libere todas as sementes',k:'crops',n:5,r:3000},
 {t:'Tenha os 8 campos',k:'fields',n:8,r:5000},{t:'Ganhe $250.000 no total',k:'earned',n:250000,r:20000}];

/* ---------- estado ---------- */
const kind=new Uint8Array(N),fid=new Int8Array(N).fill(-1),st=new Uint8Array(N),cr=new Uint8Array(N),weed=new Uint8Array(N),spr=new Uint8Array(N),stg=new Uint8Array(N),g=new Float32Array(N);
const ftiles=[];
let S;
function newState(){return{v:1,money:0,earned:0,stats:{plowed:0,seeded:0,sprayed:0,harvested:0,sold:0},stock:[0,0,0,0,0],day:1,tod:.3,owned:[1,0,0,0,0,0,0,0],fcrop:[0,0,0,0,0,0,0,0],crops:[1,0,0,0,0],up:{pspd:0,pwid:0,aspd:0,awid:0,silo:0,irr:0,auto:0},machines:[],mi:0,pm:[1,1,1,1,1],sound:1,tut:0}}
const P={x:36.5*T,y:29*T,a:0,tool:'auto',vis:'plow',hacc:0,hc:0,spd:0,moved:0,dist:0,mov:0};
let M=[];let rain=0,started=false;
const cap=()=>300*Math.pow(2,S.up.silo);
const total=()=>S.stock[0]+S.stock[1]+S.stock[2]+S.stock[3]+S.stock[4];
const pW=()=>3+S.up.pwid, aW=()=>3+S.up.awid;
const price=c=>CROPS[c].price*S.pm[c];
const mval=k=>k==='machines'?S.machines.length:k==='fields'?S.owned.filter(Boolean).length:k==='crops'?S.crops.filter(Boolean).length:k==='earned'?S.earned:S.stats[k];
const mprice=t=>Math.round(MTYPES[t].base*Math.pow(1.5,S.machines.filter(m=>m===t).length));
const uprice=k=>Math.round(UPS[k].base*Math.pow(UPS[k].mul,S.up[k]));

const ATLAS=new Image(),AT={"cow":[0,0,128,384],"barn":[128,0,192,80],"silo":[320,0,32,80],"fence":[352,0,64,64],"shed":[0,384,72,56],"house":[72,384,64,48],"apple":[136,384,224,48],"orange":[0,440,224,48],"scare":[224,440,32,32]};
/* ---------- mapa ---------- */
const YARD={x:31,y:21,w:15,h:11},POND={cx:5.5,cy:25.2,rx:3.3,ry:2.7},PAST={x:64,y:20,w:10,h:11};
const trees=[];
(function buildMap(){
 for(let y=YARD.y;y<YARD.y+YARD.h;y++)for(let x=YARD.x;x<YARD.x+YARD.w;x++)kind[y*MW+x]=4;
 const path=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(!kind[y*MW+x])kind[y*MW+x]=1};
 path(28,25,48,26);path(37,17,38,34);path(28,12,29,39);path(47,12,48,39);path(26,12,29,13);path(26,38,29,39);path(47,12,49,13);path(47,38,49,39);path(37,43,38,45);
 FIELDS.forEach((f,i)=>{for(let y=f.y;y<f.y+f.h;y++)for(let x=f.x;x<f.x+f.w;x++){const k=y*MW+x;kind[k]=2;fid[k]=i;ftiles.push(k)}});
 for(let y=PAST.y-1;y<=PAST.y+PAST.h;y++)for(let x=PAST.x-1;x<=PAST.x+PAST.w;x++)kind[y*MW+x]=5;
 for(let x=0;x<MW;x++){kind[46*MW+x]=7;kind[47*MW+x]=6;kind[48*MW+x]=6;kind[49*MW+x]=7}
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const dx=(x+.5-POND.cx)/POND.rx,dy=(y+.5-POND.cy)/POND.ry;if(dx*dx+dy*dy<1)kind[y*MW+x]=3}
 const r=rng(7);
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){

  for(let y=F.y+r0;y<F.y+r0+W;y++)for(let x=F.x;x<F.x+F.w;x++)if(needs(m.type,y*MW+x)){if(x<mn)mn=x;if(x>mx)mx=x}

function sellAll(silent){let v=0,q=0;for(let c=0;c<5;c++){const n=Math.floor(S.stock[c]);if(n>0){v+=n*price(c);q+=n;S.stock[c]-=n}}
 v=Math.round(v);if(!v){if(!silent){toast('O silo está vazio. Colha primeiro!');sfx.no()}return}
 S.money+=v;S.earned+=v;S.stats.sold++;sfx.coin();floatTxt(42.5*T,22*T,'+$'+fmt(v),'#8fd46a');toast((silent?'Cooperativa comprou ':'Vendido: ')+fmt(q)+' sacas por $'+fmt(v));hud()}
function buy(cost){if(S.money<cost){sfx.no();toast('Dinheiro insuficiente');return false}S.money-=cost;sfx.buy();return true}
function newDay(){S.day++;for(let c=0;c<5;c++)S.pm[c]=+(0.75+Math.random()*.6).toFixed(2);if(Math.random()<.3){rain=50+Math.random()*50;toast('Dia '+S.day+' 🌧️ Chuva! As plantas crescem mais rápido')}else toast('Dia '+S.day+' ☀️ Preços do mercado atualizados')}
let gt=0;
function grow(dt){
 gt+=dt;if(gt<.5)return;const e=gt;gt=0;const k=(1+.15*S.up.irr)*(rain>0?1.6:1);
 for(let n=0;n<ftiles.length;n++){const i=ftiles[n];if(st[i]!==2)continue;
  g[i]+=e/CROPS[cr[i]].time*k*(.85+hsh(i,7)*.3);
  if(g[i]>=1){st[i]=3;touch(i);continue}
  const s=Math.min(3,g[i]*4|0);let rd=false;if(s!==stg[i]){stg[i]=s;rd=true}
  if(!spr[i]&&!weed[i]&&Math.random()<.004){weed[i]=1;rd=true}
  if(rd)touch(i)}
}
function checkMission(){
 if(S.mi>=MISSIONS.length)return;const m=MISSIONS[S.mi];
 if(mval(m.k)>=m.n){S.money+=m.r;S.earned+=m.r;S.mi++;sfx.win();toast('⭐ Missão cumprida! +$'+fmt(m.r));floatTxt(P.x,P.y-20,'⭐ +$'+m.r,'#f2c230');hud()}
}

 for(let k=0;k<n;k++){const i=ftiles[k];a[k]=st[i];b[k]=cr[i];c[k]=weed[i]|spr[i]<<1;d[k]=Math.round(g[i]*100)}
 localStorage.setItem(KEY,JSON.stringify({S,t:[a,b,c,d],p:[P.x|0,P.y|0]}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(!j||!j.S||j.S.v!==1)return false;S=Object.assign(newState(),j.S);if(j.S.tut===undefined)S.tut=S.mi>=6?99:0;S.up=Object.assign(newState().up,j.S.up);
 const[a,b,c,d]=j.t;for(let k=0;k<ftiles.length;k++){const i=ftiles[k];st[i]=a[k]||0;cr[i]=b[k]||0;weed[i]=c[k]&1;spr[i]=c[k]>>1&1;g[i]=(d[k]||0)/100;stg[i]=Math.min(3,g[i]*4|0)}
 if(j.p){P.x=j.p[0];P.y=j.p[1]}return true}catch(e){return false}}
